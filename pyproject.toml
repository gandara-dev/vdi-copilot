[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "vdi-copilot"
version = "0.1.0"
description = "Evidence-first troubleshooting CLI for Citrix VDI environments"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mateus Gandara" }]
keywords = ["citrix", "vdi", "troubleshooting", "ollama"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest==8.4.2",
  "pytest-cov==7.0.0",
  "ruff==0.13.2",
]

[project.scripts]
vdi-copilot = "vdi_copilot.cli:main"

[tool.setuptools.package-data]
vdi_copilot = ["default_rules.json"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
